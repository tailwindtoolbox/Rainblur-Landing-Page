    <link rel="stylesheet" href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css"/>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap">

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap");
      
      html {
        font-family: "Rajdhani", "Orbitron", monospace;
        background: #0a0a0a;
      }

      /* Cyberpunk Neon Glow */
      .neon-glow {
        text-shadow: 
          0 0 5px #00f5ff, 
          0 0 10px #00f5ff, 
          0 0 15px #00f5ff, 
          0 0 20px #ff00ff,
          0 0 35px #ff00ff,
          0 0 40px #ff00ff;
      }
      
      .neon-cyan { 
        text-shadow: 
          0 0 5px #00f5ff, 
          0 0 10px #00f5ff, 
          0 0 20px #00f5ff, 
          0 0 40px #00f5ff; 
      }
      
      .neon-magenta { 
        text-shadow: 
          0 0 5px #ff00ff, 
          0 0 10px #ff00ff, 
          0 0 20px #ff00ff, 
          0 0 40px #ff00ff; 
      }
      
      /* Glitch Animation */
      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }
      
      .glitch {
        animation: glitch 0.3s infinite;
      }
      
      /* Scan Lines */
      .scanlines::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
          transparent 50%, 
          rgba(0,255,255,0.03) 50%
        );
        background-size: 100% 2px;
        pointer-events: none;
        z-index: 10;
      }
      
      /* Matrix Rain */
      .matrix-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        opacity: 0.1;
      }
    </style>
  </head>

    <script>
      // Simple Matrix Rain Effect
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ';
      const fontSize = 14;
      const columns = canvas.width / fontSize;
      const drops = Array(Math.floor(columns)).fill(1);
      
      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#00ff41';
        ctx.font = `${fontSize}px monospace`;
        
        drops.forEach((y, i) => {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, y * fontSize);
          
          if (y * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        });
      }
      
      setInterval(draw, 50);
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
